<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Go Calculator Web App</title>
  <style>
    body { font-family: Arial; background: #f4f4f9; margin: 40px; }
    .container { max-width: 400px; margin: auto; padding: 20px; background: #fff;
                 border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    h1 { color: #333; }
    input { width: 100%; padding: 10px; margin: 10px 0; font-size: 16px; }
    button { padding: 10px 20px; background: #0078d7; color: #fff; border: none;
             border-radius: 4px; cursor: pointer; }
    button:hover { background: #005a9e; }
    #result { margin-top: 20px; font-weight: bold; color: #0078d7; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Calculator</h1>
    <form id="calcForm">
      <input type="text" id="expr" placeholder="Enter calculation (e.g. 3+4)" required>
      <button type="submit">Calculate</button>
    </form>
    <div id="result"></div>
  </div>

  <script>
    document.getElementById("calcForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const expr = document.getElementById("expr").value;
      const response = await fetch(`/calc?expr=${encodeURIComponent(expr)}`);
      const text = await response.text();
      document.getElementById("result").innerText = text;
    });
  </script>
</body>
</html>
